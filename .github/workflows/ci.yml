name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Job 1: Pengujian Otomatis Backend (PHPUnit / Feature Tests)
  # ============================================================================
  test-backend:
    name: Backend Test (Laravel 13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Environment & SQLite Database
        run: |
          cd backend
          cp .env.example .env
          touch database/database.sqlite

      - name: Install Composer Dependencies
        run: |
          cd backend
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate Application Key
        run: |
          cd backend
          php artisan key:generate

      - name: Execute Feature Tests
        run: |
          cd backend
          php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  # ============================================================================
  # Job 2: Build Otomatis Frontend (Vue.js 3 + Vite)
  # ============================================================================
  build-frontend:
    name: Frontend Build (Vue 3 + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Assets
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # Job 3: Continuous Deployment ke GitHub Container Registry (GHCR)
  # HANYA berjalan saat push ke branch 'main' (Soal 4a)
  # ============================================================================
  deploy-ghcr:
    name: Deploy to GHCR (Docker Images)
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Lowercase Owner Name
        id: repo-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image (FrankenPHP)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/uts-pl-543220-backend:${{ github.sha }}

      - name: Build and Push Frontend Image (Vue Multi-stage)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/uts-pl-543220-frontend:${{ github.sha }}
