# ==============================================================================
# Docker Compose Orchestration - UTS Rekayasa Perangkat Lunak (NIM 543220)
# Memenuhi CPMK6, CPMK7, dan Nilai Tambahan FrankenPHP
# Menjalankan 3 service utama: db (PostgreSQL), backend (Laravel 13), frontend (Vue 3)
# ==============================================================================

services:
  # 1. Service Basis Data: PostgreSQL 16 Alpine
  db:
    image: postgres:16-alpine
    container_name: uts-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-uts_db}
      POSTGRES_USER: ${DB_USERNAME:-uts_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uts_password123}
    volumes:
      # Named volume untuk retensi dan persistensi data (Soal 6d)
      - db_data:/var/lib/postgresql/data
    networks:
      - uts-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-uts_user} -d ${DB_DATABASE:-uts_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Service Backend: Laravel 13 + FrankenPHP Application Server (+10 Bonus)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uts-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-Katalog Pustaka}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      # Komunikasi ke database menggunakan nama service 'db', bukan IP laptop (Soal 6b)
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: db
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-uts_db}"
      DB_USERNAME: "${DB_USERNAME:-uts_user}"
      DB_PASSWORD: "${DB_PASSWORD:-uts_password123}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stdout}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - uts-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Service Frontend: Vue.js 3 SPA + Nginx Web Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    container_name: uts-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - uts-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. Service Prometheus: Metric Collection & Alert Evaluation (P11)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: uts-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - uts-network
    depends_on:
      - cadvisor
      - node-exporter

  # 5. Service Grafana: Metrics Visualization & Dashboards (P11)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: uts-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - uts-network
    depends_on:
      - prometheus

  # 6. Service cAdvisor: Container Resource Metrics Collector (P11)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: uts-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - uts-network

  # 7. Service Node Exporter: Host OS & Hardware Metrics Collector (P11)
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: uts-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "9100:9100"
    networks:
      - uts-network

# Named volume untuk memastikan persistensi data saat container dimatikan
volumes:
  db_data:
    name: uts_db_data
  prometheus_data:
    name: uts_prometheus_data
  grafana_data:
    name: uts_grafana_data

# Jaringan bridge internal terisolasi antar container
networks:
  uts-network:
    driver: bridge
